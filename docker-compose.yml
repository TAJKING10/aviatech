version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: aviatech_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aviatech
      MYSQL_USER: aviatech
      MYSQL_PASSWORD: aviatech_pass
    ports:
      - "3306:3306"
    volumes:
      - aviatech_db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  aviatech_db_data:
